<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelación Financiera - Portafolio de Inversión</title>
    <!-- Tailwind CSS para estilos modernos y responsivos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fuente Inter para una estética financiera limpia -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Transiciones suaves para botones y pestañas */
        .tab-transition {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Contenedor Principal -->
    <div class="max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12 flex-grow">
        
        <!-- Encabezado / Pantalla Inicial -->
        <header class="text-center mb-8">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-200/70 text-slate-600 text-xs font-semibold tracking-wider uppercase mb-3">
                <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                Dashboard Analítico
            </div>
            <h1 class="text-2xl sm:text-4xl font-bold text-slate-900 tracking-tight">
                Modelación Financiera - Portafolio de Inversión
            </h1>
        </header>

        <!-- Barra 1: Selección de Horizonte Temporal (1 AÑO, 2 AÑOS, 3 AÑOS) -->
        <section aria-label="Horizonte Temporal" class="flex justify-center mb-8">
            <div class="inline-flex bg-slate-200/80 p-1.5 rounded-xl shadow-inner border border-slate-300/60" role="group">
                <button 
                    type="button" 
                    data-year="1 AÑO"
                    onclick="selectYear(this)"
                    class="year-btn tab-transition px-5 sm:px-7 py-2.5 rounded-lg text-sm font-semibold bg-slate-900 text-white shadow-sm cursor-pointer">
                    1 AÑO
                </button>
                <button 
                    type="button" 
                    data-year="2 AÑOS"
                    onclick="selectYear(this)"
                    class="year-btn tab-transition px-5 sm:px-7 py-2.5 rounded-lg text-sm font-semibold text-slate-600 hover:text-slate-900 cursor-pointer">
                    2 AÑOS
                </button>
                <button 
                    type="button" 
                    data-year="3 AÑOS"
                    onclick="selectYear(this)"
                    class="year-btn tab-transition px-5 sm:px-7 py-2.5 rounded-lg text-sm font-semibold text-slate-600 hover:text-slate-900 cursor-pointer">
                    3 AÑOS
                </button>
            </div>
        </section>

        <!-- Barra 2: Pestañas de Portafolio -->
        <nav aria-label="Tipo de Portafolio" class="border-b border-slate-200 mb-8">
            <div class="flex flex-col sm:flex-row justify-center gap-2 sm:gap-8">
                <button 
                    type="button"
                    data-portfolio="Portafolio Americano"
                    onclick="selectPortfolio(this)"
                    class="portfolio-tab tab-transition py-3 px-4 text-sm sm:text-base font-semibold border-b-2 border-emerald-600 text-emerald-700 flex items-center justify-center gap-2 cursor-pointer">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    Portafolio Americano
                </button>

                <button 
                    type="button"
                    data-portfolio="Portafolio Mexicano"
                    onclick="selectPortfolio(this)"
                    class="portfolio-tab tab-transition py-3 px-4 text-sm sm:text-base font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-800 hover:border-slate-300 flex items-center justify-center gap-2 cursor-pointer">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                    </svg>
                    Portafolio Mexicano
                </button>

                <button 
                    type="button"
                    data-portfolio="Portafolio General"
                    onclick="selectPortfolio(this)"
                    class="portfolio-tab tab-transition py-3 px-4 text-sm sm:text-base font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-800 hover:border-slate-300 flex items-center justify-center gap-2 cursor-pointer">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    Portafolio General
                </button>
            </div>
        </nav>

        <!-- Área de Contenido Dinámico (Espacio listo para agregar tablas, métricas y gráficas) -->
        <main id="workspace-area" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-10 transition-all">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-6 border-b border-slate-100">
                <div>
                    <span class="text-xs font-semibold uppercase tracking-wider text-emerald-600">Vista Activa</span>
                    <h2 id="current-portfolio-title" class="text-xl sm:text-2xl font-bold text-slate-900 mt-1">
                        Portafolio Americano
                    </h2>
                </div>
                <div class="inline-flex items-center gap-2 bg-slate-100 px-4 py-2 rounded-xl border border-slate-200">
                    <span class="text-xs text-slate-500 font-medium">Horizonte seleccionado:</span>
                    <span id="current-year-badge" class="text-sm font-bold text-slate-900">1 AÑO</span>
                </div>
            </div>

            <!-- Marcador de posición para los siguientes módulos -->
            <div class="mt-8 border-2 border-dashed border-slate-200 rounded-xl p-10 text-center bg-slate-50/50">
                <div class="mx-auto w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 mb-3">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                    </svg>
                </div>
                <h3 class="text-sm font-semibold text-slate-700">Área de contenido del portafolio</h3>
                <p id="status-description" class="text-xs sm:text-sm text-slate-500 mt-1 max-w-md mx-auto">
                    Aquí se mostrará la información, métricas y gráficas correspondientes al <strong class="text-slate-700">Portafolio Americano</strong> con proyección a <strong class="text-slate-700">1 AÑO</strong>.
                </p>
            </div>
        </main>

    </div>

    <!-- Lógica de navegación entre botones de años y pestañas -->
    <script>
        // Estado inicial de la aplicación
        const appState = {
            selectedYear: '1 AÑO',
            selectedPortfolio: 'Portafolio Americano'
        };

        /**
         * Actualiza el botón activo de horizonte temporal (1 AÑO, 2 AÑOS, 3 AÑOS)
         */
        function selectYear(buttonElement) {
            try {
                const year = buttonElement.getAttribute('data-year');
                appState.selectedYear = year;

                // Restablecer estilos de todos los botones de año
                const yearButtons = document.querySelectorAll('.year-btn');
                yearButtons.forEach(btn => {
                    btn.classList.remove('bg-slate-900', 'text-white', 'shadow-sm');
                    btn.classList.add('text-slate-600', 'hover:text-slate-900');
                });

                // Aplicar estilo activo al botón seleccionado
                buttonElement.classList.remove('text-slate-600', 'hover:text-slate-900');
                buttonElement.classList.add('bg-slate-900', 'text-white', 'shadow-sm');

                updateView();
            } catch (error) {
                console.error('Error al seleccionar el horizonte temporal:', error);
            }
        }

        /**
         * Actualiza la pestaña activa del portafolio
         */
        function selectPortfolio(tabElement) {
            try {
                const portfolio = tabElement.getAttribute('data-portfolio');
                appState.selectedPortfolio = portfolio;

                // Restablecer estilos de todas las pestañas
                const portfolioTabs = document.querySelectorAll('.portfolio-tab');
                portfolioTabs.forEach(tab => {
                    tab.classList.remove('border-emerald-600', 'text-emerald-700', 'font-semibold');
                    tab.classList.add('border-transparent', 'text-slate-500', 'font-medium', 'hover:text-slate-800', 'hover:border-slate-300');
                });

                // Aplicar estilo activo a la pestaña seleccionada
                tabElement.classList.remove('border-transparent', 'text-slate-500', 'font-medium', 'hover:text-slate-800', 'hover:border-slate-300');
                tabElement.classList.add('border-emerald-600', 'text-emerald-700', 'font-semibold');

                updateView();
            } catch (error) {
                console.error('Error al seleccionar la pestaña de portafolio:', error);
            }
        }

        /**
         * Sincroniza la vista previa con la combinación seleccionada
         */
        function updateView() {
            const titleEl = document.getElementById('current-portfolio-title');
            const badgeEl = document.getElementById('current-year-badge');
            const descEl = document.getElementById('status-description');

            if (titleEl) titleEl.textContent = appState.selectedPortfolio;
            if (badgeEl) badgeEl.textContent = appState.selectedYear;
            if (descEl) {
                descEl.innerHTML = `Aquí se mostrará la información, métricas y gráficas correspondientes al <strong class="text-slate-700">${appState.selectedPortfolio}</strong> con proyección a <strong class="text-slate-700">${appState.selectedYear}</strong>.`;
            }
        }
    </script>
</body>
</html>
